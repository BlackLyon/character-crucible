services:
  postgres:
    image: postgres:17-alpine
    container_name: cc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: charactercrucible
      POSTGRES_USER: cc
      # Local development only. Real secrets come from Key Vault in deployed environments.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc -d charactercrucible"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Developer tool, not part of the product. http://localhost:5050
  # Unpinned tag deliberately: a local-only tool, never deployed.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cc-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@charactercrucible.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-localdev}
      # Desktop mode: skips the login and master-password prompts for local work.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
      # Pre-registers the local server so the connection is already there.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy


  # Runs the test suite inside Linux. Windows Smart App Control blocks freshly built assemblies
  # on this machine, which presents as a test-host crash rather than a test failure -- so this is
  # the verification run that cannot be blocked. See notes/dev-environment.md.
  #
  #   docker compose run --rm tests
  #   docker compose run --rm tests dotnet test --filter FullyQualifiedName~FieldLength
  #
  # Behind a profile, so `docker compose up` does not start it.
  #
  # No depends_on: the integration tests start their own throwaway Postgres through
  # Testcontainers. The postgres service above is for running the app, not the tests.
  tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["test"]
    working_dir: /src
    environment:
      # Testcontainers starts Postgres as a SIBLING container, so the port it publishes is on the
      # host. Without this override the connection string comes back as "localhost", which in
      # here means this container, and every integration test fails to connect.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/src
      # The daemon socket, so Testcontainers can start that Postgres at all.
      - /var/run/docker.sock:/var/run/docker.sock
      # Named volumes rather than paths under /src: Linux build output must not collide with the
      # Windows obj/ and bin/ in the mounted tree, whose project.assets.json holds Windows paths.
      # They also make a second run fast instead of restoring from scratch.
      - testartifacts:/artifacts
      - testnuget:/root/.nuget/packages
    command: ["dotnet", "test", "--artifacts-path", "/artifacts"]

volumes:
  pgdata:
  pgadmindata:
  testartifacts:
  testnuget:
