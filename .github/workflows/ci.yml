# Build at zero warnings, then the whole suite: unit tests, architecture tests, the Testcontainers
# integration tests and the EF probes. Nothing deploys.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the run it supersedes. Runs on main are never cancelled, so every
# merged commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # -warnaserror is the "0 warnings" rule in CLAUDE.md, enforced rather than remembered.
      # Debug, like every local run, so CI and the compose tests service build the same thing.
      - name: Build
        run: dotnet build --no-restore -warnaserror

      # Docker is preinstalled on ubuntu-latest, so Testcontainers needs no setup here. The timeout
      # aborts (exit 3) a run stuck in code that takes the test's token; anything else waits out the
      # job's 15 minutes. A project that runs zero tests fails (exit 8) unless its csproj opts out.
      - name: Test
        run: dotnet test --no-build --timeout 5m
