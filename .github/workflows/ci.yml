# Build at zero warnings, then the whole suite: unit tests, architecture tests, the Testcontainers
# integration tests and the EF probes. Nothing deploys.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the run it supersedes. Runs on main are never cancelled, so every
# merged commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pinned to a commit, since a tag can be moved to different code. The comment is the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The SDK comes from global.json: 10.0.401 or newer. The runner may already have a newer one.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The SDK that actually ran, so a failure that only happens in CI can be traced to it.
      - name: SDK version
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      # -warnaserror is the "0 warnings" rule in CLAUDE.md, enforced rather than remembered.
      # Debug, like every local run, so CI and the compose tests service build the same thing.
      - name: Build
        run: dotnet build --no-restore -warnaserror

      # Docker is preinstalled on ubuntu-latest, so Testcontainers needs no setup here. The timeout
      # aborts (exit 3) a run stuck in code that takes the test's token; anything else waits out the
      # job's 15 minutes. A project that runs zero tests fails (exit 8).
      - name: Test
        run: dotnet test --no-build --timeout 5m
