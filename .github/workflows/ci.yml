# Build at zero warnings, then the whole suite: unit tests, architecture tests, the Testcontainers
# integration tests and the EF probes. Nothing deploys.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # -warnaserror is the "0 warnings" rule in CLAUDE.md, enforced rather than remembered.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # Docker is preinstalled on ubuntu-latest, so Testcontainers needs no setup here.
      - name: Test
        run: dotnet test --no-build --configuration Release
